<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inspiral — Tallow Ward</title>
<style>
  :root { --ink:#f2ece1; --dim:#a89f8f; --panel:rgba(18,16,14,.82); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0d0c0b;
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  #stage,#labels { position:fixed; inset:0; }
  #labels { pointer-events:none; }

  .plate { text-align:center; text-shadow:0 1px 3px #000,0 0 10px #000; pointer-events:none; }
  .plate .nm { font-weight:650; letter-spacing:.02em; white-space:nowrap; }
  .plate .ti { font-size:11px; color:var(--dim); white-space:nowrap; }
  .plate.visitor .nm { color:#9fd3ff; }

  .bubble { max-width:270px; padding:9px 12px; border-radius:12px;
    background:var(--panel); border:1px solid rgba(255,255,255,.13);
    box-shadow:0 10px 30px rgba(0,0,0,.55); backdrop-filter:blur(7px);
    font-size:13px; text-align:left; opacity:0; transform:translateY(6px);
    transition:opacity .18s ease,transform .18s ease; pointer-events:none; }
  .bubble.on { opacity:1; transform:translateY(0); }
  .bubble .verb { display:block; font-size:10px; letter-spacing:.13em;
    text-transform:uppercase; color:var(--dim); margin-bottom:3px; }
  .bubble .cite { display:block; margin-top:5px; font-size:10px; line-height:1.35;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#7fc7a0;
    border-top:1px solid rgba(127,199,160,.25); padding-top:4px; }
  .bubble .cite.bad { color:#e08b8b; border-top-color:rgba(224,139,139,.3); }

  #hud { position:fixed; left:18px; top:16px; width:310px; z-index:5; }
  #hud h1 { margin:0; font-size:17px; letter-spacing:.05em; font-weight:650; }
  #hud .sub { color:var(--dim); font-size:11.5px; margin:2px 0 10px;
    letter-spacing:.08em; text-transform:uppercase; }
  #feed { background:var(--panel); border:1px solid rgba(255,255,255,.1);
    border-radius:10px; padding:9px 11px; max-height:36vh; overflow:hidden;
    font-size:12px; color:#d9d2c6; }
  #feed div { padding:2.5px 0; border-top:1px solid rgba(255,255,255,.055); }
  #feed div:first-child { border-top:0; }
  #feed .ev { color:var(--dim); }

  #panel { position:fixed; right:18px; bottom:18px; z-index:5; display:flex;
    flex-direction:column; gap:7px; align-items:flex-end; }
  button { font:inherit; font-size:12.5px; padding:8px 13px; border-radius:9px;
    cursor:pointer; color:var(--ink); background:var(--panel);
    border:1px solid rgba(255,255,255,.16); transition:background .15s; }
  button:hover:not(:disabled) { background:rgba(60,54,46,.92); }
  button:disabled { opacity:.35; cursor:default; }
  #mint { position:fixed; right:18px; top:52px; width:320px; z-index:5;
    background:var(--panel); border:1px solid rgba(255,255,255,.12);
    border-radius:11px; padding:11px; display:none; }
  #mint.open { display:block; }
  #mint textarea { width:100%; height:150px; resize:vertical; border-radius:8px;
    padding:8px 9px; font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--ink); background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.14); }
  #mint .row { display:flex; gap:7px; margin-top:7px; justify-content:flex-end; }
  #mint .hint { color:var(--dim); font-size:11px; margin:0 0 7px; }

  #status { position:fixed; right:18px; top:16px; z-index:5; font-size:11px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  #status.live::before { content:"● "; color:#6fcf97; }
  #status.dead::before { content:"● "; color:#cf6f6f; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="labels"></div>

  <div id="hud">
    <h1>Tallow Ward</h1>
    <div class="sub" id="clock">connecting</div>
    <div id="feed"></div>
  </div>

  <div id="status">offline</div>

  <div id="mint">
    <p class="hint">Paste a character sheet. Keys optional — a bare paragraph works.</p>
    <textarea id="mint-text" spellcheck="false">Name: Halric Vaas
Title: Wharfmaster
Faction: The Wet Quarter
Brief: Runs the river landing and decides which cargo rots. Keeps a ledger of favours longer than anyone's debt book.
Goals: Control what enters the ward, Be owed by everyone
Taboos: Never begs
Register: clipped, riverside
Home: wharf</textarea>
    <div class="row">
      <button id="mint-cancel">Cancel</button>
      <button id="mint-go">Mint into the ward</button>
    </div>
  </div>

  <div id="panel">
    <button id="btn-arrive">Walk into the ward</button>
    <button id="btn-side" disabled>Back Okonkwo, in public</button>
    <button id="btn-leave" disabled>Leave</button>
    <button id="btn-mint">Mint a character…</button>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
